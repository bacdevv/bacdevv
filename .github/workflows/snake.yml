name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *" # Once daily, UTC

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Create light and dark animated SVG files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bacdevv
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%2327D3E5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%239E80FF

      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
