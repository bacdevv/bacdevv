  @keyframes spin {to{transform: rotate(360deg);}}
  @keyframes fade {0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes flow {to{stroke-dashoffset:-42;}}
  .spin {transform-origin:995px 216px;animation:spin 30s linear infinite;}
  .pulse {animation:fade 3s ease-in-out infinite;}
  .flow {animation:flow 6s linear infinite;}
  @media (prefers-reduced-motion:reduce) { .spin,.pulse,.flow { animation:none; } }
 </style>
