 <radialGradient id="haze"><stop offset="0%" stop-color="#722EBD" stop-opacity=".3"/><stop offset="100%" stop-color="#722EBD" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7C8BBD" stroke-width=".65" opacity=".13"/></pattern>
